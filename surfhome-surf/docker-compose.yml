version: "3.7"

services:
  server:
    # Prebuilt amd64/arm64 image: all dependencies and runtime files are included.
    image: ghcr.io/alexmatter1512/surf-umbrel:0.17.0-7@sha256:c9c4d12f112d03cd6d7462e899b6ffd8d40ee3f01ab89c836258bfcc84f14bc1
    network_mode: host
    init: true
    restart: on-failure
    stop_grace_period: 45s
    shm_size: "1gb"
    environment:
      SURF_HOME: /data/surf
      PORT: "18080"
      BIND_ADDR: 0.0.0.0
      DASHBOARD_PORT: "18081"
      # Chromium's namespace sandbox is unavailable in a normal Docker container.
      # Surf and Chromium still run as UID 1000, without privileged host access.
      CHROME_NO_SANDBOX: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "python3", "/opt/surf-umbrel/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
