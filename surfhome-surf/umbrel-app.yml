manifestVersion: 1
id: surfhome-surf
name: Surf
tagline: Bring the modern web to your older iOS devices
icon: https://raw.githubusercontent.com/seg6/surf/v0.17.0/backend/cmd/surf/surf-icon.png
category: networking
version: "0.17.0-6"
port: 18081
description: >-
  Run Surf's modern Chromium browser on Umbrel and stream websites to the native
  Surf app on older iPhones, iPod touches and iPads. Host networking supports
  direct LAN connections and Bonjour discovery.


  Open this app for Surf's original bundled web interface: pairing, settings,
  device management, logs and clipboard controls.
  The interface opens directly without a login. Surf's identity, paired devices
  and browser profile persist across restarts.


  First startup downloads the verified Surf release and installs Chromium and
  fonts, which can take several minutes. Internet access is required for setup.
  Supports 64-bit Intel/AMD and ARM Umbrel hosts. The iPad must already have the
  native Surf app installed. Device connections use Surf's own TLS on port 18080.
developer: seg6
website: https://github.com/seg6/surf
submitter: Community
submission: https://github.com/seg6/surf
repo: https://github.com/seg6/surf
support: https://github.com/seg6/surf/issues
gallery: []
releaseNotes: >-
  Removes generated _metadata directories from the cached uBlock Origin Lite
  extension before each Chromium launch, fixing reserved-filename errors when
  Surf loads the unpacked extension. Browser data and the original interface
  are retained.
dependencies: []
path: ""
